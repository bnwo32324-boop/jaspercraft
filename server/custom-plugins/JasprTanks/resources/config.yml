# JasprTanks: players on phones and tablets get double health and a vehicle they can swap at any time:
# a miniature Tank or a flying Orbital Sentinel.
# The touch controls announce themselves with /tank mobile once the server advertises tanks.
enabled: true
# Let browsers whose user agent looks like a desktop drive tanks too (operators always may).
desktop-players: false

mobile:
  # Extra maximum health for mobile players (20 = double a normal 20-point health bar).
  health-bonus: 20

tank:
  # Blocks the tank climbs without jumping (players normally step 0.6).
  step-height: 1.0
  # Driving speed as a multiple of walking. 2.25 matches an average horse (about 9.7 blocks/s,
  # 12.6 when sprinting). Raises walk speed rather than the speed attribute, so the view does not widen.
  speed-multiplier: 2.25
  # Extra armor points (2 points = one chestplate icon).
  armor: 6
  # 1.0 = the tank is never pushed back by hits.
  knockback-resistance: 1.0

cannon:
  # Reload time between shots, in ticks (20 ticks = 1 second).
  cooldown-ticks: 30
  # Explosion strength. Vanilla TNT is 4, a charged creeper is 6.
  power: 6.0
  # How far the crosshair aims, in blocks.
  range: 96
  # Shell speed in blocks per tick.
  speed: 2.5
  # Extra hit margin around targets, in blocks (makes touch aiming forgiving).
  aim-assist: 0.45
  # How sharply a shell curves toward the creature it was fired at, in degrees per tick (0 = straight).
  homing-degrees: 9
  # Shells never dig craters or break item frames, paintings, minecarts or dropped items unless this is true.
  break-blocks: false
  fire: false
  # Friendly fire (owner, 2026-09-29: off). While false, shells and drone strikes never aim at, detonate on or
  # hurt any player or any player's tamed pet, in a tank or a sentinel. When true, damage-players and the
  # world's PvP rule decide as before.
  friendly-fire: false
  # Shells hurt other players only in worlds with PvP on (only while friendly-fire is true).
  damage-players: true

sentinel:
  # Flying speed (vanilla creative flight is 0.1).
  fly-speed: 0.12
  # Drones per strike, the blast of each (TNT is 4) and the reload between strikes, in ticks.
  strike-drones: 3
  strike-power: 4.0
  strike-cooldown-ticks: 50
  # How far a tap reaches for an item, and the radius of automatic pickup.
  pickup-range: 24
  auto-pickup-radius: 8
  # Where a sentinel hovers while following a friend: blocks above and behind them.
  follow-height: 3.0
  follow-distance: 2.0
