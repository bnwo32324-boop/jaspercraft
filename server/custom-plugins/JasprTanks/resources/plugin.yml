name: JasprTanks
version: 1.1.0
main: chat.jaspr.tanks.TanksPlugin
softdepend: [AuthMe, EaglercraftXServer, JasprRevive, TestServerControl]
description: Mobile players get double health and a Tank or a flying Orbital Sentinel with an infinite TNT cannon or drone strikes.
commands:
  tank:
    description: Hop in or out of your tank, or switch to the Orbital Sentinel.
    usage: /tank [on|off|mode|pickup|unlock|status]
    aliases: [tanks]
    permission: jaspr.tanks.use
permissions:
  jaspr.tanks.use:
    description: Drive a tank from a phone or tablet.
    default: true
  jaspr.tanks.desktop:
    description: Drive a tank from a browser that reports a desktop user agent.
    default: op
  jaspr.tanks.admin:
    description: See server-wide tank totals in /tank status.
    default: op
