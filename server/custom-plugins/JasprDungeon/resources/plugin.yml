name: JasprDungeon
version: 5.0.0
main: chat.jaspr.dungeon.DungeonPlugin
load: POSTWORLD
description: The Dungeon Dimension - endless room dungeon; some rooms are trapped, seizing traps are rare and fall still once a room is cleared
commands:
  dungeon:
    description: Dungeon guide, location, return and creative inspection
    usage: /dungeon [where|leave|baubles|items [page]|visit <roomX> <roomZ>|status]
permissions:
  jaspr.dungeon.admin:
    default: op
