name: JasprDungeon
version: 4.0.1
main: chat.jaspr.dungeon.DungeonPlugin
load: POSTWORLD
description: The Dungeon Dimension - endless room dungeon where every room has its own dangers
commands:
  dungeon:
    description: Dungeon guide, location, return and creative inspection
    usage: /dungeon [where|leave|baubles|items [page]|visit <roomX> <roomZ>|status]
permissions:
  jaspr.dungeon.admin:
    default: op
