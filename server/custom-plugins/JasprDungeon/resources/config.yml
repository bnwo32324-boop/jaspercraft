# JasprDungeon - the Dungeon Dimension. Live JasperCraft plugin, generation 5.
# world-name names the dimension's world. Changing it starts a new dimension: the previous one's identity and room
# journals move intact to plugins/JasprDungeon/archive/, and its world folder is left untouched.
enabled: true
world-name: jaspr_dungeon5
seed-salt: 709327916
max-active-rooms: 32
room-sleep-seconds: 30
portal-dwell-ticks: 20
boss-health-multiplier: 1.0
loot-multiplier: 1.0
# Controls onward discovery only; existing pocket-world returns remain available.
rifts-discovery-enabled: true
rifts-particles: true
