# JasperCraft natural disasters.
#
# Exactly one disaster runs at a time, server-wide, and it always happens to exactly one player.
# That is the cost model: no matter how many people are online, the server is only ever paying
# for one bounded event near one player.

# Master switch. False stops every scheduled disaster; /shower, /lightning, /quake, /tornado and
# /blizzard still work.
enabled: true

# Quiet gap after any disaster ends, so one never rolls straight into the next.
cooldown-seconds: 120

# One timer for every kind. After each disaster the next one is due somewhere in this window, in
# Minecraft days (1 day = 20 real minutes), and its kind is drawn at random from the enabled kinds,
# never the same kind twice in a row. 2-13 days averages one disaster every 8 days: twice as rare as
# before 1.3.0, when each kind kept its own 1-14 day timer and two kinds meant one every 4 days or so.
schedule:
  min-days: 2
  max-days: 13

# The earthquake, the tornado and the blizzard reach you anywhere: deep in a mine, up in the sky,
# inside your base. The only safe place is an obsidian bunker: obsidian under you, over your head
# and on all four sides (an iron door or iron trapdoor is fine as the way in), each within 12
# blocks; furniture inside is fine. These three never break obsidian or an iron door in it.
#
# Where they wreck builds: in these worlds a quake cracks floors and shakes blocks out of roofs and
# ceilings, and a tornado tears through roofs, walls and trees. Obsidian, utility blocks (chests,
# furnaces, anvils, beds, turrets...), what holds them up and portals are never touched. In every
# other world they only split and tear up the natural ground, so the realms' own structures are
# kept. Empty means nowhere.
build-damage-worlds: [world]

meteor-shower:
  enabled: true

  # Announce the shower to the whole server when it starts.
  broadcast: true

  # Never pick a creative-mode player for a scheduled shower. /shower still works on yourself.
  skip-creative: true

  # Limit showers to these worlds. Empty means every world.
  worlds: []

  # How many rocks fall, how far around the player they can land, and how high they start.
  # 20 meteors at 30 ticks apart is about half a minute of sky falling, spread over a 28 block
  # radius around the target. Raising spawn-radius without raising meteors thins the shower out.
  meteors: 20
  spawn-radius: 28
  fall-height: 45
  ticks-between-meteors: 30

  # A meteor that never reports a landing (despawned, chunk unloaded) detonates after this long.
  meteor-timeout-ticks: 200

  # Impact. Power 3.0 is roughly a creeper; 4.0 is TNT.
  explosion-power: 3.0
  break-blocks: true
  scatter-radius: 3
  magma-per-impact: 6
  fire-per-impact: 8

thunder-storm:
  enabled: true

  broadcast: true
  skip-creative: true
  worlds: []

  # How long the sky stays angry.
  duration-seconds: 75

  # Bolts land inside this radius of the target, and the radius follows them as they run.
  radius: 40
  min-radius: 4

  # Cadence. 45 ticks is a bolt every 2.25 seconds, plus up to the jitter on top.
  ticks-between-bolts: 45
  bolt-jitter-ticks: 20

  # Every Nth bolt is a hell bolt: a blast that scoops a crater and leaves it burning.
  # Set to 0 for no hell bolts at all.
  super-bolt-every: 5
  super-bolt-power: 4.0
  super-bolt-effect-radius: 6

  # Hell bolt aftermath.
  break-blocks: true
  crater-radius: 3
  crater-fire: 12
  crater-magma: 7

  # Netherrack under the crater fire keeps it burning instead of guttering out.
  netherrack-floor: true

  # Every Nth ordinary bolt is a hunter bolt: it lands where the target stood a second ago, so
  # standing still during the storm is what gets you hit. Set to 0 to switch hunting off.
  hunter-bolt-every: 4

  # Chance that an ordinary bolt leaves a fire where it struck.
  scorch-chance-percent: 35

  # Caught in a hell bolt: seconds of burning and of wither.
  ignite-seconds: 5
  wither-seconds: 4

  # The target glows for the duration, so everyone can see who the storm is hunting.
  mark-target: true

earthquake:
  enabled: true
  broadcast: true
  skip-creative: true
  worlds: []

  # The quake builds, peaks halfway through and dies away.
  duration-seconds: 40

  # Everyone standing on something within this distance of the target, at any height, is shoved
  # every jolt-every-ticks, by up to jolt-strength blocks per tick sideways (harder at the peak).
  # nausea: the screen sways. Nobody sealed in an obsidian bunker feels a thing.
  radius: 24
  jolt-every-ticks: 10
  jolt-strength: 0.22
  nausea: true

  # Rocks that shake loose overhead (cave ceilings, overhangs, roofs; never out of open sky and
  # never from obsidian) and burst where they land. They hurt whoever they hit and leave no block
  # behind. In build-damage-worlds a plain ceiling block breaks out itself, leaving a hole.
  rockfall: 18

  # Fissures torn open across the floor at the target's level: in build-damage-worlds whatever it is
  # made of (cave floor, base floor, sky platform), elsewhere natural ground only. Never obsidian or
  # protected blocks. Set break-blocks to false to keep the shaking and rocks but change no terrain.
  break-blocks: true
  fissures: 4
  fissure-length: 12
  fissure-depth: 5
  fissure-lava-percent: 25

tornado:
  enabled: true
  broadcast: true
  skip-creative: true
  # Overworld skies only, whatever this list says: a tornado is weather.
  worlds: []

  duration-seconds: 50

  # Touches down this far from the target and travels toward them at speed blocks per tick (0.18
  # is 3.6 blocks a second, slower than a sprint), weaving as it goes.
  spawn-distance: 24
  speed: 0.18

  # Funnel shape. Anything within pull-radius of the funnel (wider higher up) is drawn in, spun
  # round and lifted, and thrown clear once it is carried past half the height. Players are reached
  # at any height, from a mine under the funnel to a platform in the sky above it.
  height: 26
  pull-radius: 7
  lift: 0.35

  # Under a roof or underground the wind cannot lift you out: it drags you about and batters you
  # with debris instead, this much damage a second while the funnel is on top of you (2.0 is one
  # heart). Only an obsidian bunker keeps it out.
  shelter-damage: 2.0

  # Blocks under the funnel are torn up and flung, a few a second and at most max-debris per
  # tornado: in build-damage-worlds whatever is on top (roofs, walls, trees, the ground; built
  # blocks drop as items), elsewhere only loose natural ground (grass, dirt, sand, gravel, leaves).
  break-blocks: true
  rip-blocks-per-second: 4
  max-debris: 120

blizzard:
  enabled: true
  broadcast: true
  skip-creative: true
  # Overworld skies only, whatever this list says.
  worlds: []

  duration-seconds: 90

  # Snow drives in around the target. Everyone within this distance gets colder, wherever they are:
  # slow, then sluggish, then frostbite that costs frost-damage every two seconds once they have
  # had freeze-seconds of cold out in the open. A roof overhead, or light from a torch, fire or lava
  # at warm-light or brighter, slows the cold to sheltered-percent; both together, half that again.
  # Only an obsidian bunker keeps it out and lets you warm back up.
  radius: 28
  freeze-seconds: 12
  frost-damage: 1.0
  warm-light: 11
  sheltered-percent: 40

  # Snow layers piled on open ground and roofs, and still water frozen over, near the target.
  # thaw: every layer and sheet the blizzard made melts away again once it has passed.
  break-blocks: true
  snow-per-second: 6
  max-snow: 320
  freeze-water: true
  max-ice: 80
  thaw: true

