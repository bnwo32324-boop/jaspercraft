name: JasprGear
version: 2.0.0
main: chat.jaspr.gear.GearPlugin
author: Jaspr
softdepend: [AuthMe]
description: Survivor Gear - seven trinket slots, fifteen trinkets, adrenaline, status effects and supplies, browser inventory panel and HUD.
commands:
  gear:
    description: Open your Survivor Gear slots, list worn gear, or use gear abilities.
    usage: /gear [list|vitals|recipes|scan|arc|dodge|magnet|help]
    aliases: [trinkets, kit]
permissions:
  jasprgear.admin:
    description: Give gear and read gear diagnostics.
    default: op
