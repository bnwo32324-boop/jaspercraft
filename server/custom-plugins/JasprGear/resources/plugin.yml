name: JasprGear
version: 5.0.1
main: chat.jaspr.gear.GearPlugin
author: Jaspr
softdepend: [AuthMe]
description: Survivor Gear - seven trinket slots, 32 trinkets, adrenaline, status effects, supplies, mutations, browser inventory panel, HUD and worn-gear models; six realm armouries (armour, weapons and tools stronger than diamond).
commands:
  gear:
    description: Open your Survivor Gear slots, list worn gear, or use gear abilities.
    usage: /gear [list|vitals|mutation|ability|show|recipes|sets|scan|arc|dodge|magnet|help]
    aliases: [trinkets, kit]
permissions:
  jasprgear.admin:
    description: Give gear and read gear diagnostics.
    default: op
