name: JasprNether
version: 1.2.0
main: chat.jaspr.nether.NetherPlugin
author: Jaspr
load: STARTUP
softdepend: [JasprHorrorBiomes]
description: BetterNether 0.1.8.6 and NetherEx 2.2.5 ported to vanilla-rendered Paper 1.12.2 as one harmonised, harder Nether.
commands:
  jnether:
    description: JasprNether biome, status and admin tools
    usage: /jnether [where|status|spawn|give|effect|queen|guide|quest|selftest]
  goals:
    description: Your goals in Atlas, Drownhollow and the Nether, ticked off as you go
    usage: /goals
    aliases: [goal, quests, quest, checklist]
permissions:
  jaspr.nether.admin:
    description: Spawn JasprNether mobs, give items and run the self-test.
    default: op
