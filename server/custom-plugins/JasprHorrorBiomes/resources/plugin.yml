name: JasprHorrorBiomes
version: 3.26.0
main: chat.jaspr.biomes.HorrorPlugin
load: STARTUP
commands:
  wasteland:
    description: Horror biome and expedition atlas, portal directions and Fold escape
    usage: /wasteland [nearby|atlas|structures|portal|return|status]
  where:
    description: Survey this spot -- the structure you are in and who built it, biome, cave region, opening and a fault check
    usage: /where
    aliases: [biome, survey]
permissions:
  jaspr.biomes.admin:
    default: op
